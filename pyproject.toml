[project]
name = "btc-perp-system"
version = "0.1.0"
description = "BTC perpetual futures quantitative trading system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]
research = ["matplotlib>=3.9,<4.0"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
