project:
  name: btc-perp-system
  version: "0.1.0"

market:
  symbol: BTCUSDT
  timeframe: 4h
  higher_timeframe: 1d

strategy:
  name: regime_atr
  direction: both

regime:
  bull_score: 2
  bear_score: -2

atr:
  period: 14
  stop_multiple: 1.5

risk:
  bull: 0.0075
  neutral: 0.0035
  bear: 0.0030

  max_portfolio_risk: 0.02

  daily_loss_limit: 0.02
  weekly_loss_limit: 0.05

position:
  max_notional_pct: 1.0

leverage:
  default: 5
  max: 10

management:
  breakeven_r: 1.0
  trailing_start_r: 2.0

cost:
  fee_rate: 0.0005
  slippage_rate: 0.0002
